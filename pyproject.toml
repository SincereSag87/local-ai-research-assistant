[project]
name = "local-ai-research-assistant"
version = "0.1.0"
description = "A local-first AI research assistant powered by Ollama models through an OpenAI-compatible interface."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.100.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

